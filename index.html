<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vision Y3454R</title>
    <style>
      :root {
        --bg: #f7faff;
        --text: #34495e;
        --muted: #829bb1;
        --blue: #69b8ef;
        --border: #dceaf5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.7 "Helvetica Neue",
          Arial,
          sans-serif;
        display: flex;
        justify-content: center;
        padding: 15vh 24px 48px;
      }

      main {
        width: 100%;
        max-width: 680px;
      }

      .intro {
        margin-bottom: 42px;
      }

      .logo {
        margin: 0 0 28px;
        color: var(--blue);
        font:
          12px/1.2 "SFMono-Regular",
          Consolas,
          monospace;
        white-space: pre;
      }

      .intro p {
        margin: 0 0 8px;
      }
      .intro p:first-child {
        font-size: 17px;
      }
      .intro p:last-child {
        color: var(--muted);
      }

      .terminal {
        padding: 4px 0;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 14px;
      }

      .line {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 18px 0;
      }

      .prompt {
        color: var(--blue);
        flex-shrink: 0;
      }
      .question {
        color: var(--text);
      }

      #topic {
        display: inline-block;
        min-width: 110px;
        color: var(--blue);
      }

      .cursor {
        display: inline-block;
        width: 2px;
        height: 15px;
        margin-left: 3px;
        background: var(--blue);
        vertical-align: -3px;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .input-line {
        align-items: center;
      }

      input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
      }

      input::placeholder {
        color: #a6b8c8;
      }

      #conversation {
        margin-top: 0;
      }

      .conversation-line {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .reply {
        color: var(--muted);
      }

      @media (max-width: 480px) {
        body {
          padding: 12vh 20px 32px;
        }
        .intro {
          margin-bottom: 34px;
        }
        .line {
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <pre class="logo" role="img" aria-label="Vision Y3454R cartoon logo">
 .--------.
/  o    o  \
|     ^     |
|  v1510n   |
 \_________/</pre
      >

      <section class="intro">
        <p>Hi I am Vision (ভীষণ) Yeasar, an AI veresion of Samin Yeasar.</p>
        <p>
          this is the cheapest AI portfolio using simple if-else technoloy! :3
        </p>
      </section>

      <section class="terminal">
        <div class="line">
          <span class="prompt">&gt;</span>
          <span class="question">
            hey, what do you wanna talk about?
            <span id="topic">my music?</span><span class="cursor"></span>
          </span>
        </div>

        <div id="conversation" aria-live="polite"></div>
        <form class="line input-line" id="form">
          <span class="prompt">&gt;</span>
          <input
            id="message"
            aria-label="Message"
            autocomplete="off"
            autofocus
          />
        </form>
      </section>
    </main>

    <script>
      const topics = [
        "my music?",
        "my jobs?",
        "my projects?",
        "my research?",
        "my TV shows?",
      ];

      let index = 0;
      const topic = document.getElementById("topic");
      const conversation = document.getElementById("conversation");

      setInterval(() => {
        index = (index + 1) % topics.length;
        topic.textContent = topics[index];
      }, 2200);

      function addConversationLine(text, className = "") {
        const line = document.createElement("p");
        line.className = `conversation-line ${className}`.trim();
        const prompt = document.createElement("span");
        prompt.className = "prompt";
        prompt.textContent = "> ";
        const content = document.createElement("span");
        content.textContent = text;
        line.append(prompt, content);
        conversation.append(line);
      }

      document.getElementById("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const message = document.getElementById("message").value.trim();
        if (!message) return;
        addConversationLine(message);
        addConversationLine(
          "yeee, sorry I am broke. can you give me your API key?",
          "reply",
        );
        document.getElementById("message").value = "";
      });
    </script>
  </body>
</html>
